services:
  - type: web
    name: market-intelligence-api
    plan: free
    env: python
    buildCommand: "pip install -r python-backend/requirements.txt"
    startCommand: "cd python-backend && gunicorn engine:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: market-intelligence-frontend
    env: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: VITE_API_URL
        # Vite bakes this in at BUILD time, not runtime - unset, the app falls
        # back to http://localhost:5000, which in a visitor's own browser means
        # "their machine", not this backend. Always fails with
        # ERR_CONNECTION_REFUSED, on every browser, every time - not a bug you
        # can see server-side. fromService pulls the live URL Render assigned
        # the API service, so this can't drift out of sync with a manual value.
        fromService:
          name: market-intelligence-api
          type: web
          property: host

